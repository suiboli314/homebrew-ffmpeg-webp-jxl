# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  # Smoke test: run whenever this workflow file itself changes on main,
  # so you don't have to wait for the schedule to find out it works.
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # minute hour day-of-month month day-of-week, in UTC: every day at 00:50 UTC
    - cron: "50 0 * * *"
  # Adds a "Run workflow" button on the Actions tab for manual runs
  workflow_dispatch:

# Start with no GITHUB_TOKEN permissions; the job below grants only what it needs
permissions: {}

defaults:
  run:
    # Stricter than the default: stop on any error, unset variable or failed pipe,
    # and print each command as it runs
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1

      - name: Bump formulae
        env:
          # Uses the personal access token if you created the HOMEBREW_BUMP_TOKEN
          # secret, otherwise falls back to the built-in GITHUB_TOKEN.
          # PRs opened with GITHUB_TOKEN do NOT trigger tests.yml; PRs opened with
          # a personal access token do.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"